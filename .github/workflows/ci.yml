name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Lint (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Full test suite
        run: cargo test --all
      - name: M8 version consistency
        run: ./scripts/check-version.sh
      - name: AR13 core boundary check
        run: |
          if [ -d src/core ] && grep -rnE '^[[:space:]]*use[[:space:]]+(reqwest|axum|hyper|tokio::(fs|net|io)|std::(fs|net))' src/core/; then
            echo "src/core imports an I/O crate (AR13) — move it behind a shell trait"
            exit 1
          fi

  # T11: the Dockerfile is the homelab-v2 migration path (AR20) and was
  # built by nothing. L5 found that the committed one could not run
  # Almanac at all — no WORKDIR, no volume — and without this nothing
  # stops that coming back until the migration itself.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t almanac:ci .
      - name: Prove the built image can actually start
        run: |
          # --check is the same probe the self-updater uses: it loads
          # the profiles, checks the secrets and opens the token store,
          # then exits. Passing it means this image is runnable, which
          # is exactly what the committed Dockerfile once was not.
          docker run --rm \
            -v "$PWD/fixtures/profiles:/etc/almanac/profiles:ro" \
            -e ALMANAC_SECRET_KEY=$(printf '1%.0s' $(seq 64)) \
            -e ALMANAC_TOKEN=a-login-token-for-the-ci-check \
            -e CLIENT_EMAIL=ci@example.iam.gserviceaccount.com \
            -e PRIVATE_KEY=not-a-real-key \
            -e TOKEN_URI=https://oauth2.googleapis.com/token \
            almanac:ci /usr/local/bin/almanac --check 2>&1 | tee output.txt
          grep -q -- "--check: ok" output.txt

  # T21: informational only. Not a percentage to hit — the number that
  # matters is which files are never touched at all, which is how the
  # gaps this phase closed went unnoticed for so long.
  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Measure coverage
        run: cargo llvm-cov --all --summary-only
