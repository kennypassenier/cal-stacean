[package]
name = "almanac"
version = "4.0.0"
edition = "2024"

# AR11: dependency list stays minimal to what each milestone actually
# needs. L2 reintroduces toml; M3/AR9 reintroduces backoff on top of
# what L1 adds; etc. — see docs/REALIZATION_PLAN.md.
[dependencies]
# Async runtime - "full" enables all features (I/O, timers, sync primitives, etc.)
tokio = { version = "1", features = ["full"] }

# Web framework for the HTTP API server layer
axum = { version = "0.8", features = ["form"] }
chassis = { git = "https://github.com/kennypassenier/chassis-rs", tag = "v1.5.1", version = "1.5.1", default-features = false, features = ["core", "self-update", "dashboard"] } # the shared service kit (3.0.0; dashboard since 4.0.0; 1.5.1 = CF-7 fix)

# Structured, leveled logging facade
tracing = "0.1"

# Subscriber implementation that prints tracing events to stdout/stderr
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# L1 (AR14): typed error enum with a required per-instance remedy field.
thiserror = "2"

# L1: serialization for the GoogleEvent model and Google API payloads.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# L1 (AR5/AR6): hand-rolled Google Calendar HTTP client; rustls-tls
# avoids a hard dependency on the system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# L1 (AR6): RS256 JWT signing for the Google service-account OAuth2
# flow. Pinned >=10.3.0: GHSA-h395-gr6q-cpjc (type confusion in claim
# validation, affects decode()) — Almanac only ever calls encode() on
# its own outgoing JWTs and never decodes anyone else's, so the
# vulnerable path isn't reachable either way, but there's no reason to
# carry a flagged version when the fix is a plain bump.
jsonwebtoken = { version = "10", default-features = false, features = [
    "rust_crypto",
    "use_pem",
] }

# L1: RFC3339 timestamps for JWT iat/exp claims and event start/end.
chrono = { version = "0.4", features = ["serde"] }

# L2 (AR7): mapping-profile file format.
toml = "0.9"

# L3 (K6/AR17): SHA-256 of a source's bearer token, compared in
# constant time so a wrong token can't be recovered by timing the
# comparison.
sha2 = "0.10"
subtle = "2"

# L3 (AR16): unique ids for journal entries.
uuid = { version = "1", features = ["v4"] }

# L1 (M3/AR9): exponential backoff for transient Google API failures —
# jitter, max-tries and transient-vs-permanent handling are exactly
# what this crate exists for; AR11 judged hand-rolling it a net loss.
backoff = { version = "0.4", features = ["tokio"] }

# L3 (K6/AR17): OS randomness for minting per-source bearer tokens.
getrandom = "0.4"
# L4b (M12/AR17): app tokens are stored encrypted at rest so the
# dashboard can always reproduce a working command. XChaCha20-Poly1305
# matches what Latch already uses, so both projects rest on the same
# primitive rather than two different ones.
chacha20poly1305 = { version = "0.11", default-features = false, features = [
    "alloc",
    "getrandom",
] }
hex = "0.4"
libc = "0.2.189"
# The kit harness (tests/common) starts the real App on a scratch state dir.
tempfile = "3"
# L5 (M10/AR19): verifies the minisign signature over a release
# manifest. By the minisign author, ~400 lines, verification only — no
# key handling, no signing. Hand-rolling Ed25519 signature parsing for
# the one check standing between an unattended updater and a
# compromised release host is exactly the trade AR11 says not to make.
minisign-verify = "0.2.5"
# T2: validates a profile's `timezone` against the IANA database at
# startup. Without it any string is accepted and handed to Google, so
# `Europe/Brussel` (the real one is Brussels) starts cleanly and then
# fails permanently on every single event from that source — feeding
# straight into the poison-entry behaviour, with nothing in the logs
# naming the cause. Data only; no runtime, no C dependency.
chrono-tz = { version = "0.10.4", default-features = false }

# L3: drive the Axum router directly in tests, so the ingest surface
# (auth, status codes, journalling) is exercised as real HTTP without
# binding a port.
[dev-dependencies]
# `start_paused` — lets a test drive the six-hour update interval in
# milliseconds instead of waiting it out.
tokio = { version = "1", features = ["test-util"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# T5: sends a real SIGTERM to a real process, because the graceful
# shutdown path cannot be proven any other way.
libc = "0.2.189"
